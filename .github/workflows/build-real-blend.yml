name: Build Genuine Blender Project

on:
  pull_request:
    branches: [main]
    paths:
      - "blender_rebuild/**"
      - ".github/workflows/build-real-blend.yml"
      - "PROJECT_STAGE.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-blend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6 libxxf86vm1

      - name: Download Blender 4.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/output
          curl --fail --location --retry 4 \
            "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" \
            --output blender.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  blender.tar.xz" | sha256sum -c -
          tar -xf blender.tar.xz
          ./blender-4.2.0-linux-x64/blender --version

      - name: Build Blender-native S1C repair candidate
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          ./blender-4.2.0-linux-x64/blender \
            --background \
            --python blender_rebuild/build_real_blend.py \
            -- \
            --output build/output/NomadHub_General3_V1.7_S1C.blend \
            --roundtrip build/output/NomadHub_General3_V1.7_S1C_Roundtrip.glb \
            --manifest build/output/BLENDER_BUILD_MANIFEST.json \
            --preview build/output/NomadHub_General3_V1.7_S1C_Preview.png \
            --clearance build/output/S1C_Collision_Clearance.json

      - name: Validate Blender and GLB round trip
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          test -s build/output/NomadHub_General3_V1.7_S1C.blend
          test -s build/output/NomadHub_General3_V1.7_S1C_Roundtrip.glb
          test -s build/output/NomadHub_General3_V1.7_S1C_Preview.png
          test -s build/output/S1C_Left_Orthographic.png
          test -s build/output/S1C_Right_Orthographic.png
          test -s build/output/S1C_Top_Orthographic.png
          test -s build/output/S1C_Left_Open.png
          test -s build/output/S1C_Right_Open.png
          test -s build/output/BLENDER_BUILD_MANIFEST.json
          test -s build/output/S1C_Collision_Clearance.json

          ./blender-4.2.0-linux-x64/blender \
            --background build/output/NomadHub_General3_V1.7_S1C.blend \
            --python blender_rebuild/validate_s1c.py \
            -- \
            --glb build/output/NomadHub_General3_V1.7_S1C_Roundtrip.glb \
            --clearance build/output/S1C_Collision_Clearance.json \
            --report build/output/S1C_VERIFICATION_REPORT.json

          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("build/output/BLENDER_BUILD_MANIFEST.json").read_text())
          clearance = json.loads(Path("build/output/S1C_Collision_Clearance.json").read_text())
          verification = json.loads(Path("build/output/S1C_VERIFICATION_REPORT.json").read_text())

          assert manifest["artifact_type"] == "genuine_blender_native_project"
          assert manifest["stage"] == "S1C"
          assert manifest["blender_version"].startswith("4.2")
          assert manifest["actions"] >= 13
          assert manifest["wheelbase_m"] == 5.15
          assert clearance["result"] == "PASS"
          assert verification["result"] == "PASS"
          assert verification["s2_ready"] is True
          print("S1C_MANIFEST_AND_GATE_VALIDATED")
          PY

          sha256sum build/output/* > build/output/SHA256SUMS.txt
          cat build/output/S1C_VERIFICATION_REPORT.json

      - name: Upload Blender S1C artifact
        uses: actions/upload-artifact@v4
        with:
          name: NomadHub-General3-V1.7-S1C
          path: build/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
