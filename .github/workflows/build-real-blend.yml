name: Build Genuine Blender Project

on:
  pull_request:
    branches: [main]
    paths:
      - "blender_rebuild/build_real_blend.py"
      - "blender_rebuild/finalize_s1c_hierarchy.py"
      - "blender_rebuild/validate_s1c.py"
      - "blender_rebuild/validate_s1c_hierarchy.py"
      - "blender_rebuild/ci_s1c.sh"
      - ".github/workflows/build-real-blend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-blend:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.head_ref, 'feat/s2-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6 libxxf86vm1

      - name: Restore Blender 4.2 LTS cache
        uses: actions/cache@v4
        with:
          path: |
            blender-4.2.0-linux-x64
            blender.tar.xz
          key: ${{ runner.os }}-blender-4.2.0-a51f293548ad

      - name: Prepare Blender 4.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/output
          if [ ! -x blender-4.2.0-linux-x64/blender ]; then
            curl --fail --location --retry 4 \
              "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" \
              --output blender.tar.xz
            echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  blender.tar.xz" | sha256sum -c -
            tar -xf blender.tar.xz
          fi
          ./blender-4.2.0-linux-x64/blender --version

      - name: Build and validate frozen S1C
        shell: bash
        run: bash blender_rebuild/ci_s1c.sh

      - name: Upload Blender S1C artifact
        uses: actions/upload-artifact@v4
        with:
          name: NomadHub-General3-V1.7-S1C-ACCEPTED
          path: build/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
