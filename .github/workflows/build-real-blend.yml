name: Build Genuine Blender Project

on:
  pull_request:
    branches:
      - main
    paths:
      - "blender_rebuild/**"
      - ".github/workflows/build-real-blend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-blend:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Install generator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh shapely pillow networkx

      - name: Reconstruct generator archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/output
          cat blender_rebuild/generator_archive/part_*.b64 | base64 --decode > generators.tar.gz
          echo "beeae3d0756a8d017fc299aa72b9f2351c212dd8b7b14a92d234ff018a28c7ad  generators.tar.gz" | sha256sum -c -
          tar -xzf generators.tar.gz -C blender_rebuild
          find blender_rebuild/generators -maxdepth 1 -type f -print

      - name: Regenerate S2 and S3 source GLB
        shell: bash
        run: |
          set -euo pipefail
          python blender_rebuild/generators/generate_s2_r19.py
          python blender_rebuild/generators/generate_s3_r1.py
          python blender_rebuild/generators/generate_s3_r2.py
          python blender_rebuild/generators/generate_s3_r3.py
          test -s build/stages/S3_R3/NomadHub_RV_V1.7_S3_R3_FinalCandidate.glb
          sha256sum build/stages/S3_R3/NomadHub_RV_V1.7_S3_R3_FinalCandidate.glb

      - name: Download Blender 4.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" \
            --output blender.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  blender.tar.xz" | sha256sum -c -
          tar -xf blender.tar.xz
          ./blender-4.2.0-linux-x64/blender --version

      - name: Build real .blend with Blender
        shell: bash
        run: |
          set -euo pipefail
          ./blender-4.2.0-linux-x64/blender \
            --background \
            --python blender_rebuild/build_real_blend.py \
            -- \
            --input build/stages/S3_R3/NomadHub_RV_V1.7_S3_R3_FinalCandidate.glb \
            --output build/output/NomadHub_General3_V1.7_REAL.blend \
            --roundtrip build/output/NomadHub_General3_V1.7_BlenderRoundtrip.glb \
            --manifest build/output/BLENDER_BUILD_MANIFEST.json

      - name: Validate generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/output/NomadHub_General3_V1.7_REAL.blend
          test -s build/output/NomadHub_General3_V1.7_BlenderRoundtrip.glb
          test -s build/output/BLENDER_BUILD_MANIFEST.json
          head -c 7 build/output/NomadHub_General3_V1.7_REAL.blend | grep -q BLENDER
          sha256sum build/output/* > build/output/SHA256SUMS.txt
          cat build/output/BLENDER_BUILD_MANIFEST.json

      - name: Upload Blender project artifact
        uses: actions/upload-artifact@v4
        with:
          name: NomadHub-General3-V1.7-REAL-BLEND
          path: build/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
