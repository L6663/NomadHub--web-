name: Build S2 Continuous Body R3 Fixed

on:
  pull_request:
    branches: [main]
    paths:
      - "blender_rebuild/build_s2_body_r2.py"
      - "blender_rebuild/build_s2_body_r2_entry.py"
      - "blender_rebuild/build_s2_body_r2_clearance.py"
      - "blender_rebuild/build_s2_body_r3.py"
      - "blender_rebuild/build_s2_body_r3_fix.py"
      - "blender_rebuild/preflight_s2_body_r3.py"
      - "blender_rebuild/validate_s2_body_r3.py"
      - "blender_rebuild/validate_s2_body_r2.py"
      - "blender_rebuild/validate_s2_body_r2_entry.py"
      - "blender_rebuild/build_s2_body.py"
      - "blender_rebuild/validate_s2_body.py"
      - "blender_rebuild/build_real_blend.py"
      - "blender_rebuild/finalize_s1c_hierarchy.py"
      - "blender_rebuild/validate_s1c.py"
      - ".github/workflows/build-s2-body-r3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2-r3-fixed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-s2-r3-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6 libxxf86vm1

      - name: Restore Blender 4.2 LTS cache
        uses: actions/cache@v4
        with:
          path: |
            blender-4.2.0-linux-x64
            blender.tar.xz
          key: ${{ runner.os }}-blender-4.2.0-a51f293548ad

      - name: Prepare Blender 4.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source build/output
          if [ ! -x blender-4.2.0-linux-x64/blender ]; then
            curl --fail --location --retry 4 \
              "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" \
              --output blender.tar.xz
            echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  blender.tar.xz" | sha256sum -c -
            tar -xf blender.tar.xz
          fi
          ./blender-4.2.0-linux-x64/blender --version

      - name: Rebuild frozen S1C source
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          ./blender-4.2.0-linux-x64/blender \
            --background \
            --python blender_rebuild/build_real_blend.py \
            -- \
            --output build/source/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --roundtrip build/source/NomadHub_General3_V1.7_S1C_SOURCE.glb \
            --manifest build/source/S1C_SOURCE_MANIFEST.json \
            --preview build/source/S1C_SOURCE_Preview.png \
            --clearance build/source/S1C_Collision_Clearance.json

          ./blender-4.2.0-linux-x64/blender \
            --background build/source/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --python blender_rebuild/finalize_s1c_hierarchy.py \
            -- \
            --blend build/source/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --roundtrip build/source/NomadHub_General3_V1.7_S1C_SOURCE.glb \
            --manifest build/source/S1C_SOURCE_MANIFEST.json \
            --preview build/source/S1C_SOURCE_Preview.png \
            --skip-proofs

          test -s build/source/NomadHub_General3_V1.7_S1C_SOURCE.blend
          test -s build/source/S1C_Collision_Clearance.json
          cp build/source/S1C_SOURCE_MANIFEST.json build/output/S2_R3_BUILD_MANIFEST.json
          cp build/source/S1C_Collision_Clearance.json build/output/S1C_Collision_Clearance.json

      - name: Fast R3 preflight
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          ./blender-4.2.0-linux-x64/blender \
            --background build/source/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --python blender_rebuild/preflight_s2_body_r3.py \
            -- \
            --report build/output/S2_R3_PREFLIGHT_REPORT.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/output/S2_R3_PREFLIGHT_REPORT.json").read_text())
          assert report["status"] == "PASS"
          assert report["iteration"] == "R3"
          assert report["opening_boundaries"]["loop_count"] == 17
          assert report["opening_boundaries"]["closed_loop_count"] == 17
          assert report["wheel_body_clearance"]["result"] == "PASS"
          assert report["visual_contract"]["result"] == "PASS"
          print("S2_R3_PREFLIGHT_GATE_PASS")
          PY

      - name: Build repaired R3 evidence and GLB
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          ./blender-4.2.0-linux-x64/blender \
            --background build/source/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --python blender_rebuild/build_s2_body_r3_fix.py \
            -- \
            --output build/output/NomadHub_General3_V1.7_S2_R3.blend \
            --roundtrip build/output/NomadHub_General3_V1.7_S2_R3.glb \
            --manifest build/output/S2_R3_BUILD_MANIFEST.json \
            --preview build/output/S2_R3_Preview.png \
            --left build/output/S2_R3_Left_Orthographic.png \
            --right build/output/S2_R3_Right_Orthographic.png \
            --top build/output/S2_R3_Top_Orthographic.png \
            --wire-left build/output/S2_R3_Left_Wireframe.png \
            --wire-right build/output/S2_R3_Right_Wireframe.png

      - name: Validate repaired R3 contract
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          for file in \
            NomadHub_General3_V1.7_S2_R3.blend \
            NomadHub_General3_V1.7_S2_R3.glb \
            S2_R3_Preview.png \
            S2_R3_Left_Orthographic.png \
            S2_R3_Right_Orthographic.png \
            S2_R3_Top_Orthographic.png \
            S2_R3_Left_Wireframe.png \
            S2_R3_Right_Wireframe.png \
            S2_R3_Front_Closeup.png \
            S2_R3_Wheel_Closeup.png \
            S2_R3_Zebra_Left.png \
            S2_R3_Zebra_Right.png \
            S2_R3_BUILD_MANIFEST.json \
            S2_R3_PREFLIGHT_REPORT.json \
            S1C_Collision_Clearance.json; do
            test -s "build/output/${file}"
          done

          if compgen -G "build/output/*.blend1" > /dev/null; then
            echo "Unexpected Blender backup file in S2 R3 delivery"
            exit 1
          fi

          ./blender-4.2.0-linux-x64/blender \
            --background build/output/NomadHub_General3_V1.7_S2_R3.blend \
            --python-expr "import sys; sys.path.insert(0, r'${GITHUB_WORKSPACE}/blender_rebuild')" \
            --python blender_rebuild/validate_s2_body_r3.py \
            -- \
            --glb build/output/NomadHub_General3_V1.7_S2_R3.glb \
            --clearance build/output/S1C_Collision_Clearance.json \
            --manifest build/output/S2_R3_BUILD_MANIFEST.json \
            --report build/output/S2_R3_VERIFICATION_REPORT.json

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("build/output/S2_R3_BUILD_MANIFEST.json")
          report_path = Path("build/output/S2_R3_VERIFICATION_REPORT.json")
          preflight_path = Path("build/output/S2_R3_PREFLIGHT_REPORT.json")
          manifest = json.loads(manifest_path.read_text())
          report = json.loads(report_path.read_text())
          preflight = json.loads(preflight_path.read_text())

          assert preflight["status"] == "PASS"
          assert manifest["stage"] == "S2"
          assert manifest["iteration"] == "R3"
          assert manifest["source_true_openings"] is True
          assert manifest["true_opening_count"] == 17
          assert manifest["topology"]["quad_ratio"] == 1.0
          assert manifest["topology"]["triangles"] == 0
          assert manifest["topology"]["ngons"] == 0
          assert manifest["actions"] >= 13
          assert manifest["r3_visual_repairs"]["smooth_wheel_arch_transition"] is True
          assert manifest["r3_visual_repairs"]["web_node_and_animation_contract_preserved"] is True
          assert manifest["r3_visual_repairs"]["cab_door_moving_origins_centered"] is True
          assert manifest["r3_visual_repairs"]["hatch_outward_clearance_m"] > 0
          assert report["status"] == "PASS"
          assert report["s2_r3_ready_for_manual_visual_review"] is True
          assert report["blend_body"]["true_opening_topology"]["result"] == "PASS"
          assert report["blend_body"]["wheel_body_clearance"]["result"] == "PASS"
          assert report["glb_body"]["wheel_body_clearance"]["result"] == "PASS"
          assert report["blend_s1c_compatibility"]["animation_collision_sweep"]["result"] == "PASS"
          assert report["glb_s1c_compatibility"]["animation_collision_sweep"]["result"] == "PASS"

          manifest["stage_status"] = "R3_TECHNICALLY_VALIDATED_MANUAL_VISUAL_REVIEW_REQUIRED"
          manifest["s2_r3_ready_for_manual_visual_review"] = True
          manifest["preflight_report"] = preflight_path.name
          manifest["preflight_sha256"] = hashlib.sha256(preflight_path.read_bytes()).hexdigest()
          manifest["verification_report"] = report_path.name
          manifest["verification_sha256"] = hashlib.sha256(report_path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print("S2_R3_FIXED_CANDIDATE_VALIDATED")
          PY

          (
            cd build/output
            sha256sum \
              NomadHub_General3_V1.7_S2_R3.blend \
              NomadHub_General3_V1.7_S2_R3.glb \
              S1C_Collision_Clearance.json \
              S2_R3_BUILD_MANIFEST.json \
              S2_R3_PREFLIGHT_REPORT.json \
              S2_R3_Left_Orthographic.png \
              S2_R3_Left_Wireframe.png \
              S2_R3_Preview.png \
              S2_R3_Right_Orthographic.png \
              S2_R3_Right_Wireframe.png \
              S2_R3_Top_Orthographic.png \
              S2_R3_Front_Closeup.png \
              S2_R3_Wheel_Closeup.png \
              S2_R3_Zebra_Left.png \
              S2_R3_Zebra_Right.png \
              S2_R3_VERIFICATION_REPORT.json \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload S2 R3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: NomadHub-General3-V1.7-S2-R3-CANDIDATE
          path: build/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NomadHub-S2-R3-FIXED-FAILURE-DIAGNOSTICS
          path: |
            build/output/*.json
            build/output/*.txt
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 1
