name: Build S2 Continuous Body R1

on:
  pull_request:
    branches: [main]
    paths:
      - "blender_rebuild/build_s2_body.py"
      - "blender_rebuild/validate_s2_body.py"
      - "blender_rebuild/build_real_blend.py"
      - "blender_rebuild/finalize_s1c_hierarchy.py"
      - "blender_rebuild/validate_s1c.py"
      - ".github/workflows/build-s2-body.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-s2-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6 libxxf86vm1

      - name: Download Blender 4.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/output
          curl --fail --location --retry 4 \
            "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" \
            --output blender.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  blender.tar.xz" | sha256sum -c -
          tar -xf blender.tar.xz
          ./blender-4.2.0-linux-x64/blender --version

      - name: Rebuild frozen S1C source
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          ./blender-4.2.0-linux-x64/blender \
            --background \
            --python blender_rebuild/build_real_blend.py \
            -- \
            --output build/output/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --roundtrip build/output/NomadHub_General3_V1.7_S1C_SOURCE.glb \
            --manifest build/output/S1C_SOURCE_MANIFEST.json \
            --preview build/output/S1C_SOURCE_Preview.png \
            --clearance build/output/S1C_Collision_Clearance.json

          ./blender-4.2.0-linux-x64/blender \
            --background build/output/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --python blender_rebuild/finalize_s1c_hierarchy.py \
            -- \
            --blend build/output/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --roundtrip build/output/NomadHub_General3_V1.7_S1C_SOURCE.glb \
            --manifest build/output/S1C_SOURCE_MANIFEST.json \
            --preview build/output/S1C_SOURCE_Preview.png

      - name: Build S2 R1 connected body cage
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          cp build/output/S1C_SOURCE_MANIFEST.json build/output/S2_BUILD_MANIFEST.json
          ./blender-4.2.0-linux-x64/blender \
            --background build/output/NomadHub_General3_V1.7_S1C_SOURCE.blend \
            --python blender_rebuild/build_s2_body.py \
            -- \
            --output build/output/NomadHub_General3_V1.7_S2_R1.blend \
            --roundtrip build/output/NomadHub_General3_V1.7_S2_R1.glb \
            --manifest build/output/S2_BUILD_MANIFEST.json \
            --preview build/output/S2_R1_Preview.png \
            --left build/output/S2_R1_Left_Orthographic.png \
            --right build/output/S2_R1_Right_Orthographic.png \
            --wire-left build/output/S2_R1_Left_Wireframe.png \
            --wire-right build/output/S2_R1_Right_Wireframe.png

      - name: Validate S2 topology and S1C compatibility
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          test -s build/output/NomadHub_General3_V1.7_S2_R1.blend
          test -s build/output/NomadHub_General3_V1.7_S2_R1.glb
          test -s build/output/S2_R1_Preview.png
          test -s build/output/S2_R1_Left_Orthographic.png
          test -s build/output/S2_R1_Right_Orthographic.png
          test -s build/output/S2_R1_Left_Wireframe.png
          test -s build/output/S2_R1_Right_Wireframe.png
          test -s build/output/S2_BUILD_MANIFEST.json
          test -s build/output/S1C_Collision_Clearance.json

          ./blender-4.2.0-linux-x64/blender \
            --background build/output/NomadHub_General3_V1.7_S2_R1.blend \
            --python blender_rebuild/validate_s2_body.py \
            -- \
            --glb build/output/NomadHub_General3_V1.7_S2_R1.glb \
            --clearance build/output/S1C_Collision_Clearance.json \
            --report build/output/S2_R1_VERIFICATION_REPORT.json

          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("build/output/S2_BUILD_MANIFEST.json").read_text())
          report = json.loads(Path("build/output/S2_R1_VERIFICATION_REPORT.json").read_text())

          assert manifest["stage"] == "S2"
          assert manifest["iteration"] == "R1"
          assert manifest["body_object"] == "BODY_S2_CONTROL_CAGE"
          assert manifest["actions"] >= 13
          assert manifest["topology"]["quad_ratio"] >= 0.98
          assert manifest["topology"]["non_quads"] <= 2
          assert report["result"] == "PASS"
          assert report["s2_accepted"] is False
          print("S2_R1_CANDIDATE_VALIDATED")
          PY

          sha256sum build/output/* > build/output/SHA256SUMS.txt
          cat build/output/S2_R1_VERIFICATION_REPORT.json

      - name: Upload S2 R1 candidate
        uses: actions/upload-artifact@v4
        with:
          name: NomadHub-General3-V1.7-S2-R1-CANDIDATE
          path: build/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
